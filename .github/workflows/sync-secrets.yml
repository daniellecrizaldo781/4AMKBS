name: Sync Google Docs into Secrets

# Fetches both cascade Google Docs and updates the encrypted repo secrets
# (REFUND_CASCADE_DOC, TAGGING_CASCADE_DOC) so the site auto-updates.
# Requires a PAT with `repo` scope stored as the SYNC_PAT repository secret
# (Settings > Secrets and variables > Actions > New repository secret).
on:
  schedule:
    - cron: '37 5 * * *'        # daily 05:37 UTC (before sync-to-site at 06:23)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch both Google Docs (public text export)
        run: |
          curl -sL --fail "https://docs.google.com/document/d/139FanVB1D07-zdVhei7suQtIaHyL7ihLs3bz9pQuluw/export?format=txt" -o /tmp/refund.txt
          curl -sL --fail "https://docs.google.com/document/d/1nnjYnRg8HuA_Hvu6f1_2G2guIKZgIlLp13nOiWORjfY/export?format=txt" -o /tmp/tagging.txt
          echo "refund bytes: $(wc -c < /tmp/refund.txt)"
          echo "tagging bytes: $(wc -c < /tmp/tagging.txt)"

      - name: Update secrets via GitHub API (libsodium sealed box)
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.error
          from nacl.public import PublicKey, SealedBox
          TOK=os.environ["SYNC_PAT"]; REPO=os.environ["REPO"]
          H={"Authorization":"Bearer "+TOK,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"kb","Content-Type":"application/json"}
          def api(method,url,data=None):
            r=urllib.request.Request(url,data=(json.dumps(data).encode() if data is not None else None),headers=H,method=method)
            return urllib.request.urlopen(r,timeout=60)
          pk=json.loads(api("GET",f"https://api.github.com/repos/{REPO}/actions/secrets/public-key").read())
          box=SealedBox(PublicKey(base64.b64decode(pk["key"])))
          for name,path in [("REFUND_CASCADE_DOC","/tmp/refund.txt"),("TAGGING_CASCADE_DOC","/tmp/tagging.txt")]:
            val=open(path,encoding="utf-8").read()
            enc=base64.b64encode(box.encrypt(val.encode())).decode()
            api("PUT",f"https://api.github.com/repos/{REPO}/actions/secrets/{name}",{"encrypted_value":enc,"key_id":pk["key_id"]})
            print("updated secret:",name)
          PY
