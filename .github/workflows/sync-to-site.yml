name: Sync Cascades to Site

# Rebuilds assets/js/cascades-data.js by FETCHING THE LIVE CASCADE TRACKING SHEET (CSV export).
# The sheet is the single source of truth (replaces the old Google Docs).
# The sheet ID comes from the CASCADE_SHEET_ID repository secret; the CSV is fetched directly
# (no secret holds the data, so there is no 64KB size limit).
# If the fetch fails, the workflow aborts WITHOUT overwriting the existing data,
# so a transient network error can never wipe the cascade list.
on:
  schedule:
    - cron: '23 6 * * *'        # daily 06:23 UTC
  workflow_dispatch:            # manual "Run" button
  # NOTE: no `push` trigger on purpose — pushing this file must NOT re-trigger a rebuild.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CASCADE_SHEET_ID: ${{ secrets.CASCADE_SHEET_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live cascade tracking sheet (CSV export)
        run: |
          set -euo pipefail
          if [ -z "$CASCADE_SHEET_ID" ]; then
            echo "CASCADE_SHEET_ID secret is not set — refusing to run."; exit 1
          fi
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          curl -fsSL -A "$UA" "https://docs.google.com/spreadsheets/d/${CASCADE_SHEET_ID}/export?format=csv&gid=0" -o /tmp/sheet.csv
          echo "sheet bytes: $(wc -c < /tmp/sheet.csv)"
          # Sanity: export must contain at least one data row beyond the header.
          python3 - <<'PY'
          import csv
          rows=list(csv.DictReader(open("/tmp/sheet.csv",encoding="utf-8-sig")))
          if len(rows)==0:
            print("Sheet export looks empty/bad; aborting to protect data"); raise SystemExit(1)
          print("sheet rows:", len(rows))
          PY

      - name: Parse sheet into cascades-data.js (status-tagged, one card per row)
        run: |
          python3 - <<'PY'
          import csv, re, json, datetime
          STATUS_MAP = {
            "new / current":"new","new/current":"new",
            "active / existing":"active","active/existing":"active","active":"active",
            "superseded":"superseded","replaced":"superseded","retired":"retired",
          }
          DEFAULT_STATUS="active"
          RULES = [
            ("OHA / Hearing Aids", ["oricle hearing aid","oha ","audiologist","hearing aid","hearing specialist","hearing consultation","consultation booking","bte","hearing concern"]),
            ("Marketplace Escalations", ["amazon","walmart","ebay","marketplace"]),
            ("Returns & Refunds", ["refund","return","redo","warranty","reship","rts","return portal","return label","return to sender","return policy","return process","return completed","return handling"]),
            ("Email & Comms", ["email","gorgias","zendesk","marketing","bbb","trust pilot","nova","macro","ticket","unsubscribe","ivr","ghost call","misrouted","social media"]),
            ("Shipping & Fulfillment", ["shiphero","sticky","shipment","fulfillment","warehouse","dhl","ups","shipping","delivery","tracking","order cancellation","order hold","manual order","damaged","duplicate order","rts / undelivered","undelivered package"]),
            ("Tagging & Tracking", ["tagging","tag "]),
            ("Order Processing", ["order","sku","campaign","upsell"]),
          ]
          DEF="General CSR Handling"
          CHANNELS={"email":"Email","call":"Call","email + call":"Email + Call","entire team":"Entire Team"}
          CH_ICON={"Email":"\U0001F4E7","Call":"\U0001F4DE","Email + Call":"\U0001F4E7\U0001F4DE","Entire Team":"\U0001F465"}
          CAS_RE=re.compile(r"Cascaded by[:\s]+(.+?)(?:\n|$)", re.I)
          DRIVE_RE=re.compile(r"drive\.google\.com/(?:file/d/|open\?id=)([A-Za-z0-9_-]+)")
          def img_url(raw):
            if not raw: return ""
            if raw.strip().upper() in ("N/A","NA","-"): return ""
            m=DRIVE_RE.search(raw)
            if m: return f"https://lh3.googleusercontent.com/d/{m.group(1)}"
            if raw.lower().startswith("http") and re.search(r"\.(png|jpe?g|webp|gif)", raw, re.I): return raw
            return ""
          def norm(s): return STATUS_MAP.get(re.sub(r"\s+"," ",(s or "").strip().lower()), DEFAULT_STATUS)
          def cat(t,b):
            x=(t+" "+b[:200]).lower()
            for c,kws in RULES:
              if any(k in x for k in kws): return c
            return DEF
          def ch(t,b):
            return CHANNELS.get((r.get("Channel") or "").strip().lower(), "")
          def slug(s): return re.sub(r"[^a-z0-9]+","-",s.lower()).strip("-")[:60]
          def ts(d):
            try: return datetime.datetime.strptime((d or "").strip(),"%B %d, %Y").timestamp()
            except: return 0
          rows=list(csv.DictReader(open("/tmp/sheet.csv",encoding="utf-8-sig")))
          cascades=[]; used={}
          for i,r in enumerate(rows):
            date=(r.get("Date") or "").strip(); title=(r.get("Cascade Title") or "").strip()
            body=re.sub(r"\n{3,}","\n\n",(r.get("Cascade") or "").strip()).strip()
            # Skip completely blank rows (empty title AND empty body) so the sheet's
            # blank/template rows never become "Untitled cascade N" junk cards.
            if not title and not body:
                continue
            img=(r.get("Sample Image") or "").strip(); status=norm(r.get("Cascade Status"))
            img_url_val=img_url(img)
            supersedes_raw=(r.get("Superseded Cascade") or r.get("Supersedes") or "").strip()
            if supersedes_raw.upper() in ("NONE","N/A","NA","-"): supersedes_raw=""
            if not title: title=body[:60] or f"Untitled cascade {i+1}"
            by=CAS_RE.search(body); by=by.group(1).strip() if by else ""
            c=cat(title,body); chx=ch(title,body); tags=[chx] if chx else []
            if by: tags.append("Cascaded by "+by)
            if supersedes_raw: tags.append("Supersedes: "+supersedes_raw)
            base=slug(title)+"-"+slug(date); base=base if base else "entry"
            if base in used: used[base]+=1; cid=f"{base}-{used[base]}"
            else: used[base]=0; cid=base
            cascades.append({"id":cid,"title":title,"category":c,"supersedes":supersedes_raw,"supersededBy":"","channel":chx,
              "channelIcon":CH_ICON.get(chx,"\U0001F465"),"product":"","date":date,"status":status,
              "desc":re.sub(r"\s+"," ",body)[:160],"tags":tags,"cascadedBy":by,
              "sampleImage":img,"sampleImageUrl":img_url_val,"relatedResources":[],"relatedProducts":[],
              "versions":[{"status":status,"label":status.upper(),"date":date,"by":by,"title":title,"body":body}]})
          title_to_id={c["title"]:c["id"] for c in cascades}
          for c in cascades:
            s=c.get("supersedes","").strip()
            if s and s in title_to_id and title_to_id[s]!=c["id"]:
              older=next((x for x in cascades if x["id"]==title_to_id[s]),None)
              if older: older["supersededBy"]=c["title"]
          cascades.sort(key=lambda c:ts(c["date"]),reverse=True)
          js="/* Auto-generated from the live cascade tracking sheet by sync-to-site.yml.\n"
          js+="   Status comes from the sheet's 'Cascade Status' column. Newest first. */\n"
          js+="window.KB_RAW_CASCADES = "+json.dumps(cascades,indent=2,ensure_ascii=False)+";\n"
          open("assets/js/cascades-data.js","w",encoding="utf-8").write(js)
          from collections import Counter
          print("cascades:",len(cascades),"| by status:",dict(Counter(c["status"] for c in cascades)))
          PY

      - name: Safety check — never commit fewer than 1 cascade
        run: |
          python3 - <<'PY'
          import re, json
          t=open("assets/js/cascades-data.js",encoding="utf-8").read()
          n=len(json.loads(re.search(r"window\.KB_RAW_CASCADES = (.*);",t,re.S).group(1)))
          if n < 1:
            print(f"ABORT: only {n} cascades parsed — refusing to publish (likely a bad fetch)."); raise SystemExit(1)
          print(f"OK: {n} cascades parsed.")
          PY

      - name: Commit & push if changed
        run: |
          git config user.name "cascade auto-sync"
          git config user.email "auto-sync@users.noreply.github.com"
          if ! git diff --quiet -- assets/js/cascades-data.js; then
            git add assets/js/cascades-data.js
            git commit -m "auto-sync: rebuild cascades-data.js from live sheet $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "pushed"
          else
            echo "no change"
          fi
