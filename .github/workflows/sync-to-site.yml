name: Sync Cascades to Site

# Rebuilds assets/js/cascades-data.js from the two encrypted cascade secrets
# (REFUND_CASCADE_DOC, TAGGING_CASCADE_DOC) and pushes to the public site.
on:
  schedule:
    - cron: '23 6 * * *'        # daily 06:23 UTC
  workflow_dispatch:            # manual "Run" button
  push:
    paths:
      - '.github/workflows/sync-to-site.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write secrets to temp files (never logged)
        run: |
          printf '%s' "$REFUND" > /tmp/refund.txt
          printf '%s' "$TAGGING" > /tmp/tagging.txt
        env:
          REFUND: ${{ secrets.REFUND_CASCADE_DOC }}
          TAGGING: ${{ secrets.TAGGING_CASCADE_DOC }}

      - name: Parse both docs into cascades-data.js (one card per dated entry)
        run: |
          python3 - <<'PY'
          import os, re, json, datetime
          DATE_RE = re.compile(r"^([A-Z][a-z]+ \d{1,2}, \d{4})\s*-\s*(.+?)\s*$", re.M)
          CAS_RE  = re.compile(r"Cascaded by[:\s]+(.+?)(?:\n|$)", re.I)
          RULES = [
            ("OHA / Hearing Aids", ["oricle hearing aid","oha ","audiologist","hearing aid",
                                    "hearing specialist","hearing consultation","consultation booking",
                                    "bte","hearing concern"]),
            ("Marketplace Escalations", ["amazon","walmart","ebay","marketplace"]),
            ("Returns & Refunds", ["refund","return","redo","warranty","reship","rts",
                                    "return portal","return label","return to sender","return policy",
                                    "return process","return completed","return handling"]),
            ("Email & Comms", ["email","gorgias","zendesk","marketing","bbb","trust pilot",
                                "nova","macro","ticket","unsubscribe","ivr","ghost call",
                                "misrouted","social media"]),
            ("Shipping & Fulfillment", ["shiphero","sticky","shipment","fulfillment","warehouse",
                                         "dhl","ups","shipping","delivery","tracking",
                                         "order cancellation","order hold","manual order",
                                         "damaged","duplicate order","rts / undelivered",
                                         "undelivered package"]),
            ("Tagging & Tracking", ["tagging","tag "]),
            ("Order Processing", ["order","sku","campaign","upsell"]),
          ]
          DEF = "General CSR Handling"
          def split(text):
            ms=list(DATE_RE.finditer(text)); out=[]
            for i,m in enumerate(ms):
              d=m.group(1); t=m.group(2).strip(); s=m.end(); e=ms[i+1].start() if i+1<len(ms) else len(text)
              b=text[s:e].strip(); b=re.sub(r"\n{3,}","\n\n",b).strip()
              out.append({"date":d,"title":t,"body":b})
            return out
          def cat(t,b):
            blob=(t+" "+b[:200]).lower()
            for c,kws in RULES:
              if any(k in blob for k in kws): return c
            return DEF
          def slug(s): return re.sub(r"[^a-z0-9]+","-",s.lower()).strip("-")[:60]
          def ts(d):
            try: return datetime.datetime.strptime(d,"%B %d, %Y").timestamp()
            except: return 0
          all_e=[]
          for path,src in (("/tmp/refund.txt","refund"),("/tmp/tagging.txt","tagging")):
            if os.path.exists(path):
              for e in split(open(path,encoding="utf-8").read()):
                e["source"]=src; all_e.append(e)
          # dedupe exact (date+title); keep longer body
          seen={}
          for e in all_e:
            k=(e["date"],e["title"].lower())
            if k in seen:
              if len(e["body"])>len(seen[k]["body"]): seen[k]=e
            else: seen[k]=e
          uniq=list(seen.values())
          uniq.sort(key=lambda e:ts(e["date"]),reverse=True)  # newest first
          cascades=[]; used={}
          for e in uniq:
            c=cat(e["title"],e["body"])
            by=CAS_RE.search(e["body"]); by=by.group(1).strip() if by else ""
            base=slug(e["title"])+"-"+slug(e["date"])
            base=base if base else "entry"
            if base in used: used[base]+=1; cid=f"{base}-{used[base]}"
            else: used[base]=0; cid=base
            cascades.append({"id":cid,"title":e["title"],"category":c,"product":"",
              "date":e["date"],"status":"current","desc":re.sub(r"\s+"," ",e["body"])[:160],
              "tags":[],"relatedResources":[],"relatedProducts":[],
              "versions":[{"status":"current","label":"CURRENT","date":e["date"],"by":by,
                           "title":e["title"],"body":e["body"]}]})
          js="// AUTO-GENERATED by sync-to-site.yml — do not edit by hand.\n"
          js+="// Sources: REFUND_CASCADE_DOC + TAGGING_CASCADE_DOC (encrypted repo secrets).\n"
          js+="// One cascade card per dated entry; newest first.\n"
          js+="window.KB_RAW_CASCADES = "+json.dumps(cascades,indent=2,ensure_ascii=False)+";\n"
          with open("assets/js/cascades-data.js","w",encoding="utf-8") as f: f.write(js)
          print("cascades:",len(cascades),"| unique dated entries:",len(uniq))
          from collections import Counter
          print("by handling:",dict(Counter(c["category"] for c in cascades)))
          PY

      - name: Commit & push if changed
        run: |
          git config user.name "cascade auto-sync"
          git config user.email "auto-sync@users.noreply.github.com"
          if ! git diff --quiet -- assets/js/cascades-data.js; then
            git add assets/js/cascades-data.js
            git commit -m "auto-sync: rebuild cascades-data.js from secrets $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "pushed"
          else
            echo "no change"
          fi
