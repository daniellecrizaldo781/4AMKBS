name: Sync Products to Site

# Rebuilds assets/js/products-data.js by FETCHING THE LIVE PRODUCT SHEET (CSV export).
# The sheet is the single source of truth. The sheet ID comes from the
# PRODUCT_SHEET_ID repository secret; the CSV is fetched directly (no secret
# holds the data, so there is no 64KB size limit).
# If the fetch fails, the workflow aborts WITHOUT overwriting the existing data,
# so a transient network error can never wipe the product list.
on:
  schedule:
    - cron: '7-59/15 * * * *'     # every 15 minutes (offset 7 to avoid clashing with sync-to-site), picks up sheet edits automatically
  workflow_dispatch:            # manual "Run" button
  # NOTE: no `push` trigger on purpose — pushing this file must NOT re-trigger a rebuild.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PRODUCT_SHEET_ID: ${{ secrets.PRODUCT_SHEET_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live product sheet (CSV export)
        run: |
          set -euo pipefail
          if [ -z "$PRODUCT_SHEET_ID" ]; then
            echo "PRODUCT_SHEET_ID secret is not set — refusing to run."; exit 1
          fi
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          curl -fsSL -A "$UA" "https://docs.google.com/spreadsheets/d/${PRODUCT_SHEET_ID}/export?format=csv&gid=0" -o /tmp/products.csv
          echo "sheet bytes: $(wc -c < /tmp/products.csv)"
          python3 - <<'PY'
          import csv
          rows=list(csv.DictReader(open("/tmp/products.csv",encoding="utf-8-sig")))
          if len(rows)==0:
            print("Product sheet export looks empty/bad; aborting to protect data"); raise SystemExit(1)
          print("product rows:", len(rows))
          PY

      - name: Parse sheet into products-data.js (status-tagged, one card per product)
        run: |
          python3 - <<'PY'
          import csv, re, json, urllib.request, urllib.error
          DRIVE_RE=re.compile(r"drive\.google\.com/(?:file/d/|open\?id=)([A-Za-z0-9_-]+)")
          def drive_id(raw):
              if not raw: return ""
              m=DRIVE_RE.search(raw)
              return m.group(1) if m else ""
          def img_url(raw):
              if not raw: return ""
              if raw.strip().upper() in ("N/A","NA","-"): return ""
              m=DRIVE_RE.search(raw)
              if m: return f"https://lh3.googleusercontent.com/d/{m.group(1)}"
              if raw.lower().startswith("http") and re.search(r"\.(png|jpe?g|webp|gif)", raw, re.I): return raw
              return ""
          # Probe whether a Drive file id is an IMAGE we can embed (lh3 serves image/*).
          def is_drive_image(fid):
              if not fid: return False
              try:
                  req=urllib.request.Request(f"https://lh3.googleusercontent.com/d/{fid}",
                      headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"},
                      method="GET")
                  req.get_method=lambda:"HEAD"
                  r=urllib.request.urlopen(req, timeout=20)
                  return (r.headers.get("Content-Type") or "").startswith("image/")
              except Exception:
                  return False
          def site_url(raw):
              if not raw: return ""
              s=raw.strip()
              if s.upper() in ("N/A","NA","-"): return ""
              if s.lower().startswith("http"): return s
              return ""
          def slug(s): return re.sub(r"[^a-z0-9]+","-",s.lower()).strip("-")[:60]
          def cat(name):
              n=name.lower()
              if "hearing" in n or "oricle" in n: return "Hearing"
              if "splash" in n or "clean" in n or "foam" in n or "rinse" in n or "spotless" in n: return "Cleaning"
              if "skin" in n or "breath" in n or "care" in n: return "Personal Care"
              if "ear" in n or "denta" in n or "blast" in n: return "Dental"
              if "pet" in n or "bark" in n or "pee" in n: return "Pet"
              return "Other"
          def grp(cat):
              return {"Hearing":"hearing","Cleaning":"cleaning","Personal Care":"care",
                      "Dental":"dental","Pet":"pet","Other":"other"}.get(cat,"other")
          # strip a trailing " (something)" qualifier from the product name for the slug only
          rows=list(csv.DictReader(open("/tmp/products.csv",encoding="utf-8-sig")))
          products=[]
          used={}
          for i,r in enumerate(rows):
              name=(r.get("Product Name") or "").strip()
              if not name:  # skip blank rows
                  continue
              info=(r.get("Product Information ") or r.get("Product Information") or "").strip()
              pkg=(r.get("Package Inclusion") or "").strip()
              instr=(r.get("Instructions") or "").strip()
              pricing_dtc=(r.get("Pricing DTC") or "").strip()
              pricing_shop=(r.get("Pricing Shopify") or "").strip()
              dtc=(r.get("DTC Website") or "").strip()
              shop=(r.get("Shopify Website") or "").strip()
              ret=(r.get("Return Policy") or "").strip()
              email=(r.get("Email Support") or "").strip()
              hotline=(r.get("Hotline Number") or "").strip()
              image=(r.get("Image") or "").strip()
              did=drive_id(image)
              c=cat(name); g=grp(c)
              base=slug(name); base=base if base else "product"
              if base in used: used[base]+=1; s=base+"-"+str(used[base])
              else: used[base]=0; s=base
              # collect every Drive id referenced in this product's fields so we can
              # probe which ones are embeddable images (package/instructions/etc.)
              field_blob=" ".join([info,pkg,instr,pricing_dtc,pricing_shop,ret,image])
              prod_drive_ids=[m for m in DRIVE_RE.findall(field_blob) if m]
              products.append({
                  "slug":s,"name":name,"category":c,"group":g,
                  "image":img_url(image),"imageRaw":image,"imageThumb":(f"https://drive.google.com/thumbnail?id={did}&sz=w800" if did else ""),
                  "information":info,"package":pkg,"instructions":instr,
                  # Pricing columns hold Drive links to pricing IMAGES -> lh3 thumbnails.
                  "pricingDtc":site_url(pricing_dtc),"pricingDtcImg":img_url(pricing_dtc),
                  "pricingShopify":site_url(pricing_shop),"pricingShopifyImg":img_url(pricing_shop),
                  "dtcUrl":site_url(dtc),"shopifyUrl":site_url(shop),
                  "returnPolicy":ret,
                  "emailSupport":email,"hotline":hotline,
                  "_driveIds":prod_drive_ids
              })
          products.sort(key=lambda p:p["name"].lower())
          # Build a global map of Drive id -> {lh3, thumb} for every id that is an image.
          all_ids=[]
          for p in products:
              for did in p.pop("_driveIds", []):
                  if did not in all_ids: all_ids.append(did)
          drive_images={}
          for fid in all_ids:
              if is_drive_image(fid):
                  drive_images[fid]={"lh3":f"https://lh3.googleusercontent.com/d/{fid}",
                                      "thumb":f"https://drive.google.com/thumbnail?id={fid}&sz=w800"}
          js="/* Auto-generated from the live product sheet by sync-products.yml.\n"
          js+="   Newest products first by name. Images: Google Drive links -> lh3 thumbnails. */\n"
          js+="window.KB_RAW_PRODUCTS = "+json.dumps(products,indent=2,ensure_ascii=False)+";\n"
          js+="/* Map of Google Drive file id -> image URLs for any sheet field that links to a Drive IMAGE. */\n"
          js+="window.KB_DRIVE_IMAGES = "+json.dumps(drive_images,indent=2,ensure_ascii=False)+";\n"
          open("assets/js/products-data.js","w",encoding="utf-8").write(js)
          print("products:",len(products),"| with image:",sum(1 for p in products if p["image"]),"| drive image ids:",len(drive_images))
          PY

      - name: Safety check — never commit fewer than 1 product
        run: |
          python3 - <<'PY'
          import re, json
          t=open("assets/js/products-data.js",encoding="utf-8").read()
          n=len(json.loads(re.search(r"window\.KB_RAW_PRODUCTS = (.*);",t,re.S).group(1)))
          if n < 1:
            print(f"ABORT: only {n} products parsed — refusing to publish (likely a bad fetch)."); raise SystemExit(1)
          print(f"OK: {n} products parsed.")
          PY

      - name: Commit & push if changed
        run: |
          git config user.name "product auto-sync"
          git config user.email "auto-sync@users.noreply.github.com"
          if ! git diff --quiet -- assets/js/products-data.js; then
            git add assets/js/products-data.js
            git commit -m "auto-sync: rebuild products-data.js from live product sheet $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "pushed"
          else
            echo "no change"
          fi
