<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="4AM Media Knowledge Base System — one place where a CSR can go when they need an answer." />
  <title>4AM Media Knowledge Base</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="layout" id="layout">
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="sidebar__brand">
        <a href="#/dashboard" class="brand" aria-label="4AM Media Knowledge Base home">
          <span class="brand__mark" id="brand-mark-sidebar" aria-hidden="true"></span>
          <span class="brand__text">
            <span class="brand__name">4AM MEDIA</span>
            <span class="brand__sub">Knowledge Base</span>
          </span>
        </a>
        <button class="sidebar__close" id="sidebar-close" aria-label="Close navigation">&times;</button>
      </div>

      <nav class="nav" id="primary-nav" aria-label="Sections">
        <a class="nav__item" href="#/dashboard" data-section="dashboard">
          <span class="nav__icon" aria-hidden="true">&#9632;</span> Dashboard
        </a>
        <a class="nav__item" href="#/cascades" data-section="cascades">
          <span class="nav__icon" aria-hidden="true">&#9888;</span> Cascade &amp; Handling Updates
        </a>
        <a class="nav__item" href="#/products" data-section="products">
          <span class="nav__icon" aria-hidden="true">&#9670;</span> Products
        </a>
        <a class="nav__item" href="#/resources" data-section="resources">
          <span class="nav__icon" aria-hidden="true">&#9633;</span> Resources
        </a>
        <a class="nav__item" href="#/handbook" data-section="handbook">
          <span class="nav__icon" aria-hidden="true">&#9776;</span> Handbook &amp; Policies
        </a>
        <a class="nav__item" href="#/team" data-section="team">
          <span class="nav__icon" aria-hidden="true">&#9678;</span> Our Team
        </a>
      </nav>

      <div class="sidebar__foot">
        <span class="pill pill--soft">Phase 1 Prototype</span>
        <p class="sidebar__note">Design &amp; architecture preview. Real content incoming.</p>
      </div>
    </aside>

    <div class="overlay" id="overlay" hidden></div>

    <!-- ===== Main column ===== -->
    <div class="main">
      <header class="topbar" id="topbar">
        <button class="topbar__hamburger" id="hamburger" aria-label="Open navigation">&#9776;</button>
        <span class="topbar__logo" id="brand-mark-header" aria-hidden="true"></span>

        <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></nav>

        <div class="search" id="global-search">
          <span class="search__icon" aria-hidden="true">&#9906;</span>
          <input
            type="search"
            id="global-search-input"
            class="search__input"
            placeholder="Search cascades, products, policies, resources..."
            aria-label="Global search"
            autocomplete="off" />
          <div class="search__dropdown" id="search-dropdown" hidden></div>
        </div>

        <div class="topbar__util">
          <span class="topbar__badge" title="Internal CSR tool">CSR</span>
        </div>
      </header>

      <main class="content" id="app-content" tabindex="-1"></main>
    </div>
  </div>

  <!-- Scripts: classic (non-module) order so the app opens directly from file:// -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/pages.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
